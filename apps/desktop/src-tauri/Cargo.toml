[package]
name = "director-desktop-next"
version = "0.1.0"
edition = "2021"
description = "Local four-stage production workbench"

[lib]
name = "director_core"
path = "src/lib.rs"

[[bin]]
name = "director-desktop-next"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "director-next-core"
path = "src/bin/core.rs"

[features]
default = []
desktop = ["dep:tauri", "dep:tauri-build", "dep:rfd"]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip", "raw_value"] }
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
base64 = "0.22"
flate2 = "1"
tar = "0.4"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["process", "io-util", "time", "rt-multi-thread", "sync", "macros", "fs"] }
roxmltree = "0.20"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
keyring = { version = "3", features = ["windows-native", "apple-native"] }
tempfile = "3"
tauri = { version = "2", optional = true, features = ["protocol-asset"] }
rfd = { version = "0.15", optional = true }

[build-dependencies]
tauri-build = { version = "2", optional = true , features = [] }
